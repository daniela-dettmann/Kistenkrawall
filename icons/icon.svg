<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1b6f66"/>
      <stop offset=".55" stop-color="#103d38"/>
      <stop offset="1" stop-color="#0a1f1b"/>
    </radialGradient>
    <radialGradient id="boom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".55" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f05a2a"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef1"/>
      <stop offset=".6" stop-color="#b9c2c8"/>
      <stop offset="1" stop-color="#8d979e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa54a"/>
      <stop offset=".55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#d9650a"/>
    </linearGradient>
    <linearGradient id="woodL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a05a"/>
      <stop offset="1" stop-color="#b47634"/>
    </linearGradient>
    <linearGradient id="woodR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86a2c"/>
      <stop offset="1" stop-color="#7f4c1c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#5a1a00" flood-opacity=".75"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g id="art">
    <!-- explosion burst -->
    <polygon fill="#e8452c" opacity=".4" points="256,18 286,128 368,52 340,158 462,128 372,206 494,236 376,262 470,334 352,320 398,430 310,356 300,474 256,372 212,474 202,356 114,430 160,320 42,334 136,262 18,236 140,206 50,128 172,158 144,52 226,128"/>
    <polygon fill="url(#boom)" points="256,46 280,140 350,78 328,166 436,142 356,210 466,240 360,258 440,322 338,308 376,404 302,342 290,446 256,354 222,446 210,342 136,404 174,308 72,322 152,258 46,240 156,210 76,142 184,166 162,78 232,140"/>

    <!-- sparks -->
    <g fill="#fff4c2">
      <circle cx="98" cy="96" r="7"/><circle cx="420" cy="92" r="6"/><circle cx="440" cy="190" r="4"/>
      <circle cx="70" cy="200" r="5"/><circle cx="118" cy="150" r="3.5"/>
    </g>

    <!-- flying lid -->
    <g transform="translate(392 118) rotate(24)">
      <polygon points="0,-30 62,0 0,30 -62,0" fill="#e2ab63" stroke="#5a3412" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="-62,0 0,30 62,0 62,12 0,42 -62,12" fill="#8f5a26" stroke="#5a3412" stroke-width="7" stroke-linejoin="round"/>
      <line x1="-34" y1="-14" x2="34" y2="14" stroke="#6d4421" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- crate interior (open top) -->
    <polygon points="256,238 362,291 256,344 150,291" fill="#2e1c0c"/>

    <!-- robot body + head popping out -->
    <g filter="url(#shadow)">
      <rect x="166" y="226" width="180" height="120" rx="34" fill="url(#orange)" stroke="#5c2c05" stroke-width="7"/>
      <ellipse cx="166" cy="246" rx="26" ry="20" fill="#ff9d3d" stroke="#5c2c05" stroke-width="7"/>
      <ellipse cx="346" cy="246" rx="26" ry="20" fill="#d9650a" stroke="#5c2c05" stroke-width="7"/>
      <!-- antenna -->
      <line x1="256" y1="112" x2="256" y2="68" stroke="#4a5258" stroke-width="8" stroke-linecap="round"/>
      <circle cx="256" cy="62" r="20" fill="#ffd257" filter="url(#glow)" opacity=".9"/>
      <circle cx="256" cy="62" r="13" fill="#ffe9a0" stroke="#5c3d00" stroke-width="5"/>
      <!-- ears -->
      <rect x="160" y="150" width="26" height="46" rx="8" fill="#ff8a1f" stroke="#5c2c05" stroke-width="7"/>
      <rect x="326" y="150" width="26" height="46" rx="8" fill="#d9650a" stroke="#5c2c05" stroke-width="7"/>
      <!-- head -->
      <rect x="180" y="104" width="152" height="126" rx="22" fill="url(#metal)" stroke="#2b3236" stroke-width="7"/>
      <line x1="256" y1="108" x2="256" y2="146" stroke="#7f898f" stroke-width="3"/>
      <g fill="#59636a"><circle cx="196" cy="120" r="4.5"/><circle cx="316" cy="120" r="4.5"/><circle cx="196" cy="214" r="4.5"/><circle cx="316" cy="214" r="4.5"/></g>
      <!-- visor -->
      <rect x="196" y="152" width="120" height="40" rx="12" fill="#1a1d20"/>
      <rect x="204" y="160" width="104" height="24" rx="8" fill="#ffe08a" filter="url(#glow)" opacity=".85"/>
      <rect x="204" y="160" width="104" height="24" rx="8" fill="#ffe08a"/>
      <!-- angry eyes -->
      <polygon points="214,166 246,174 244,182 216,180" fill="#1a1d20"/>
      <polygon points="298,166 266,174 268,182 296,180" fill="#1a1d20"/>
      <rect x="208" y="162" width="96" height="4" rx="2" fill="#fffbe6" opacity=".8"/>
    </g>

    <!-- crate front faces (cover robot below the rim) -->
    <g stroke="#4a2a0e" stroke-width="8" stroke-linejoin="round">
      <polygon points="150,291 256,344 256,456 150,403" fill="url(#woodL)"/>
      <polygon points="256,344 362,291 362,403 256,456" fill="url(#woodR)"/>
    </g>
    <!-- planks -->
    <g stroke="#6b3f17" stroke-width="3" opacity=".55">
      <line x1="150" y1="328" x2="256" y2="381"/><line x1="150" y1="366" x2="256" y2="419"/>
      <line x1="256" y1="381" x2="362" y2="328"/><line x1="256" y1="419" x2="362" y2="366"/>
    </g>
    <!-- frame + braces -->
    <g fill="none" stroke="#5a3412" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="160,303 246,346 246,440 160,397"/>
      <line x1="164" y1="306" x2="242" y2="436"/>
      <polygon points="266,346 352,303 352,397 266,440"/>
      <line x1="270" y1="436" x2="348" y2="306"/>
    </g>
    <!-- rim highlight -->
    <polyline points="150,291 256,344 362,291" fill="none" stroke="#f0c48a" stroke-width="5" stroke-linejoin="round"/>
    <!-- nails -->
    <g fill="#2b2b2b"><circle cx="160" cy="303" r="4"/><circle cx="246" cy="346" r="4"/><circle cx="266" cy="346" r="4"/><circle cx="352" cy="303" r="4"/><circle cx="160" cy="397" r="4"/><circle cx="246" cy="440" r="4"/><circle cx="266" cy="440" r="4"/><circle cx="352" cy="397" r="4"/></g>
  </g>
</svg>
