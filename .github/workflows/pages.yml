name: GitHub Pages

# Pull requests: the browser test, split into four parts that run at the same time.
# Push to main (after a merge): assemble the site and publish it, without testing again.
# Merge only when the test of the pull request is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: test (Teil ${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html tonstudio.html musiktest.html sw.js manifest.webmanifest .nojekyll css js fonts icons vendor _site/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the test browser is kept between runs; only the system libraries are installed each time
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Test-Browser installieren
        run: |
          npm ci
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Spiel testen (Teil ${{ matrix.part }} von 4)
        run: node tests/smoke.cjs _site
        env:
          KK_PART: ${{ matrix.part }}

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html tonstudio.html musiktest.html sw.js manifest.webmanifest .nojekyll css js fonts icons vendor _site/
          # every deploy gets its own version: fresh offline cache, version shown in the
          # start menu, and version.json lets installed apps notice that an update exists
          V="${GITHUB_SHA::12}"
          D="$(date -u +%Y-%m-%d)"
          sed -i "s/const VERSION = 'kk-dev';/const VERSION = 'kk-$V';/" _site/sw.js
          sed -i "s/<meta name=\"kk-version\" content=\"dev\" data-date=\"\">/<meta name=\"kk-version\" content=\"$V\" data-date=\"$D\">/" _site/index.html
          printf '{"version":"%s","date":"%s"}\n' "$V" "$D" > _site/version.json
          grep -q "kk-$V" _site/sw.js
          grep -q "content=\"$V\"" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
